<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bird Species Identifier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="feather feather-a" aria-hidden="true"></div>
    <div class="feather feather-b" aria-hidden="true"></div>

    <main class="page">
      <nav class="page-nav" aria-label="Page">
        <a class="nav-link" href="/help">Help</a>
      </nav>

      <header class="hero">
        <div class="hero-badge" aria-hidden="true">🪶</div>
        <h1>Bird Species Identifier</h1>
        <p class="tagline">
          Classify 200 bird species from 312 perceptual attributes using a random forest
        </p>
      </header>

      <section class="card" id="model-status" aria-live="polite">
        <p class="status-line">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Training model…</span>
        </p>
        <p class="status-meta" id="status-meta" hidden></p>
      </section>

      <section class="card" id="samples-card" hidden>
        <p class="examples-label">Try a held-out bird (image id):</p>
        <div class="example-chips" id="sample-chips"></div>
      </section>

      <section class="card" id="predict-card" hidden>
        <label class="field-label" for="image-id">Image ID</label>
        <div class="predict-row">
          <input type="number" id="image-id" min="1" step="1" />
          <button type="button" class="btn btn-primary" id="btn-predict">Classify</button>
        </div>
        <p id="error-text" class="error" role="alert" hidden></p>
      </section>

      <section class="card result-card" id="result-card" hidden>
        <p class="result-label">Result</p>
        <p id="result-headline" class="result-headline"></p>
        <p id="result-truth" class="result-truth"></p>
        <h3 class="top-label">Top predictions</h3>
        <ul class="top-list" id="top-list"></ul>
      </section>
    </main>

    <script src="/static/session-persist.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
